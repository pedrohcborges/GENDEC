<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ICAO Annex 9 - General Declaration Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }

    h1, h2 { color: var(--primary); text-transform: uppercase; }
    h1 { margin-top: 0; font-size: 1.2rem; text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; letter-spacing: 1px; }
    h2 { font-size: 0.9rem; margin-top: 20px; border-bottom: 1px solid var(--border); padding-bottom: 6px; letter-spacing: 0.5px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input, select {
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px; /* Evita auto-zoom do iOS em inputs */
      color: var(--text);
      text-transform: uppercase;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    .dynamic-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    .dynamic-table th, .dynamic-table td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: left;
    }

    .dynamic-table th {
      background-color: #0f172a;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .btn {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      transition: background-color 0.2s;
      font-size: 0.85rem;
    }

    .btn:hover { background-color: var(--primary-hover); color: white; }
    .btn-secondary { background-color: #334155; color: var(--text); margin-top: 5px; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-save { background-color: var(--success); color: #0f172a; margin-top: 15px; width: 100%; }
    .btn-save:hover { background-color: #16a34a; color: white; }
    .btn-danger { background-color: var(--danger); color: white; padding: 6px 10px; font-size: 0.8rem; }
    .btn-clear { background-color: #475569; color: white; padding: 8px 12px; font-size: 0.75rem; margin-top: 8px; align-self: flex-start; }
    .btn-submit { width: 100%; padding: 15px; font-size: 1rem; margin-top: 15px; }

    .canvas-container {
      background: #ffffff;
      border: 2px dashed var(--border);
      border-radius: 6px;
      display: block;
      width: 100%;
      max-width: 400px;
      touch-action: none;
      margin-top: 5px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 120px;
      cursor: crosshair;
    }

    .toast {
      display: none;
      background-color: var(--success);
      color: #0f172a;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    /* Formatação para impressão/PDF */
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        font-size: 9pt;
        text-transform: uppercase;
      }

      .gen-dec-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      .gen-dec-table td, .gen-dec-table th {
        border: 1px solid #000;
        padding: 5px;
        vertical-align: top;
      }

      .signature-img {
        max-height: 50px;
        max-width: 250px;
        display: block;
        margin-top: 5px;
      }

      .text-center { text-align: center; }
      .bold { font-weight: bold; }
      .no-print { display: none !important; }
    }

    #printable-area { display: none; }
  </style>
</head>
<body>

<div class="container no-print">
  <h1>GENERAL DECLARATION (ICAO ANNEX 9 APPENDIX 1)</h1>
  <form id="genDecForm">
    
    <h2>1. GENERAL INFORMATION</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>OPERATOR</label>
        <input type="text" id="operator" required>
      </div>
      <div class="form-group">
        <label>MARKS OF NATIONALITY & REG.</label>
        <input type="text" id="registration" placeholder="E.G. PT-XXX" required>
      </div>
      <div class="form-group">
        <label>FLIGHT TYPE</label>
        <select id="flightType">
          <option value="PRIVATE">PRIVATE</option>
          <option value="SCHEDULED">SCHEDULED</option>
          <option value="CHARTER">CHARTER</option>
        </select>
      </div>
      <div class="form-group">
        <label>DATE</label>
        <input type="date" id="date" required>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>DEPARTURE FROM (PLACE)</label>
        <input type="text" id="depPlace" required>
      </div>
      <div class="form-group">
        <label>DEPARTURE TIME (EXPECTED)</label>
        <input type="time" id="depTime" required>
      </div>
      <div class="form-group">
        <label>ARRIVAL AT (PLACE)</label>
        <input type="text" id="arrPlace" required>
      </div>
      <div class="form-group">
        <label>ARRIVAL TIME (EXPECTED)</label>
        <input type="time" id="arrTime" required>
      </div>
    </div>

    <h2>2. CREW MANIFEST</h2>
    <div class="table-wrapper">
      <table class="dynamic-table" id="crewTable">
        <thead>
          <tr>
            <th>NAME</th>
            <th>FUNC.</th>
            <th>BIRTH DATE</th>
            <th>BIRTH PLACE</th>
            <th>PASSPORT COUNTRY & NO.</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addCrewRow()">+ ADD CREW MEMBER</button>

    <h2>3. PASSENGER MANIFEST</h2>
    <div class="table-wrapper">
      <table class="dynamic-table" id="paxTable">
        <thead>
          <tr>
            <th>NAME</th>
            <th>BIRTH DATE</th>
            <th>BIRTH PLACE</th>
            <th>PASSPORT COUNTRY & NO.</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addPaxRow()">+ ADD PASSENGER</button>

    <h2>4. HEALTH & AUTHORIZATION</h2>
    <div class="form-group">
      <label>AUTHORIZED AGENT OR PILOT-IN-COMMAND (NAME)</label>
      <input type="text" id="picName" required>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label>SIGNATURE (DESENHE SUA ASSINATURA ABAIXO)</label>
      <div class="canvas-container">
        <canvas id="sigCanvas" width="400" height="120"></canvas>
      </div>
      <button type="button" class="btn btn-clear" onclick="clearCanvas()">LIMPAR ASSINATURA</button>
    </div>

    <button type="button" class="btn btn-save" onclick="saveDefaults()">💾 SALVAR OPERADOR, CREW E ASSINATURA COMO PADRÃO</button>
    <div id="toast" class="toast">DADOS E ASSINATURA SALVOS COM SUCESSO!</div>

    <button type="button" class="btn btn-submit" onclick="generateAndPrint()">GERAR / IMPRIMIR DECLARAÇÃO</button>
  </form>
</div>

<!-- Render Area for Print/PDF -->
<div id="printable-area"></div>

<script>
  let canvas, ctx, isDrawing = false;

  window.onload = () => {
    initCanvas();
    loadDefaults();
  };

  function initCanvas() {
    canvas = document.getElementById('sigCanvas');
    ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000000';

    // Eventos de Mouse
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Eventos de Touch para Celular / Tablet
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const mouseEvent = new MouseEvent('mousedown', {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const mouseEvent = new MouseEvent('mousemove', {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const mouseEvent = new MouseEvent('mouseup', {});
      canvas.dispatchEvent(mouseEvent);
    });
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    if (isDrawing) {
      ctx.closePath();
      isDrawing = false;
    }
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function isCanvasBlank() {
    const pixelBuffer = new Uint32Array(
      ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer
    );
    return !pixelBuffer.some(color => color !== 0);
  }

  function toUpper(str) {
    return (str || '').toUpperCase();
  }

  function addCrewRow(name = '', func = 'PILOT', dob = '', pob = '', pass = '') {
    const tbody = document.querySelector('#crewTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="c-name" value="${name}"></td>
      <td><input type="text" class="c-func" value="${func}"></td>
      <td><input type="date" class="c-dob" value="${dob}"></td>
      <td><input type="text" class="c-pob" value="${pob}"></td>
      <td><input type="text" class="c-pass" value="${pass}"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function addPaxRow() {
    const tbody = document.querySelector('#paxTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="p-name"></td>
      <td><input type="date" class="p-dob"></td>
      <td><input type="text" class="p-pob"></td>
      <td><input type="text" class="p-pass"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function saveDefaults() {
    const operator = document.getElementById('operator').value;
    const picName = document.getElementById('picName').value;
    
    const crewData = [];
    document.querySelectorAll('#crewTable tbody tr').forEach(tr => {
      crewData.push({
        name: tr.querySelector('.c-name').value,
        func: tr.querySelector('.c-func').value,
        dob: tr.querySelector('.c-dob').value,
        pob: tr.querySelector('.c-pob').value,
        pass: tr.querySelector('.c-pass').value
      });
    });

    const sigData = isCanvasBlank() ? '' : canvas.toDataURL();

    const defaults = {
      operator,
      picName,
      crewData,
      sigData
    };

    localStorage.setItem('gendec_defaults', JSON.stringify(defaults));

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }

  function loadDefaults() {
    const saved = localStorage.getItem('gendec_defaults');
    
    if (saved) {
      const defaults = JSON.parse(saved);
      document.getElementById('operator').value = defaults.operator || '';
      document.getElementById('picName').value = defaults.picName || '';
      
      const tbody = document.querySelector('#crewTable tbody');
      tbody.innerHTML = '';
      if (defaults.crewData && defaults.crewData.length > 0) {
        defaults.crewData.forEach(c => addCrewRow(c.name, c.func, c.dob, c.pob, c.pass));
      } else {
        addCrewRow('', 'PILOT');
        addCrewRow('', 'PILOT');
      }

      if (defaults.sigData) {
        const img = new Image();
        img.onload = () => {
          clearCanvas();
          ctx.drawImage(img, 0, 0);
        };
        img.src = defaults.sigData;
      }
    } else {
      addCrewRow('', 'PILOT');
      addCrewRow('', 'PILOT');
    }

    addPaxRow();
  }

  function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function generateAndPrint() {
    const container = document.getElementById('printable-area');
    
    // Extrai dados da Tripulação
    let crewRows = '';
    document.querySelectorAll('#crewTable tbody tr').forEach(tr => {
      const name = toUpper(tr.querySelector('.c-name').value);
      const func = toUpper(tr.querySelector('.c-func').value);
      const dob = formatDate(tr.querySelector('.c-dob').value);
      const pob = toUpper(tr.querySelector('.c-pob').value);
      const pass = toUpper(tr.querySelector('.c-pass').value);
      if (name) {
        crewRows += `
          <tr>
            <td colspan="2">${name}</td>
            <td colspan="2">${func}</td>
            <td>${dob}</td>
            <td>${pob}</td>
            <td colspan="2">${pass}</td>
          </tr>`;
      }
    });

    // Extrai dados dos Passageiros
    let paxRows = '';
    document.querySelectorAll('#paxTable tbody tr').forEach(tr => {
      const name = toUpper(tr.querySelector('.p-name').value);
      const dob = formatDate(tr.querySelector('.p-dob').value);
      const pob = toUpper(tr.querySelector('.p-pob').value);
      const pass = toUpper(tr.querySelector('.p-pass').value);
      if (name) {
        paxRows += `
          <tr>
            <td colspan="3">${name}</td>
            <td colspan="2">${dob}</td>
            <td>${pob}</td>
            <td colspan="2">${pass}</td>
          </tr>`;
      }
    });

    const signatureImgTag = isCanvasBlank() 
      ? '<br><br>________________________________________________________'
      : `<img src="${canvas.toDataURL()}" class="signature-img" /><br>________________________________________________________`;

    // Gera o Layout Oficial
    container.innerHTML = `
      <div class="text-center bold" style="font-size: 12pt;">GENERAL DECLARATION</div>
      <div class="text-center" style="font-size: 8pt; margin-bottom: 10px;">(OUTWARD/INWARD)<br>ICAO ANNEX 9 APPENDIX 1<br>AGRICULTURE, CUSTOMS, IMMIGRATION, AND PUBLIC HEALTH</div>
      
      <table class="gen-dec-table">
        <tr>
          <td colspan="4"><strong>OPERATOR:</strong> ${toUpper(document.getElementById('operator').value)}</td>
          <td colspan="4"><strong>DATE:</strong> ${formatDate(document.getElementById('date').value)}</td>
        </tr>
        <tr>
          <td colspan="4"><strong>MARKS OF NATIONALITY AND REGISTRATION:</strong> ${toUpper(document.getElementById('registration').value)}</td>
          <td colspan="4"><strong>FLIGHT:</strong> ${toUpper(document.getElementById('flightType').value)}</td>
        </tr>
        <tr>
          <td colspan="4"><strong>DEPARTURE FROM (PLACE):</strong> ${toUpper(document.getElementById('depPlace').value)}</td>
          <td colspan="4"><strong>ARRIVAL AT (PLACE):</strong> ${toUpper(document.getElementById('arrPlace').value)}</td>
        </tr>
        <tr>
          <td colspan="4"><strong>DEPARTURE TIME (EXPECTED):</strong> ${document.getElementById('depTime').value}</td>
          <td colspan="4"><strong>ARRIVAL TIME (EXPECTED):</strong> ${document.getElementById('arrTime').value}</td>
        </tr>
        
        <tr><th colspan="8" class="text-center" style="background:#eee;">CREW MANIFEST</th></tr>
        <tr class="bold" style="font-size: 8pt;">
          <td colspan="2">NAME</td>
          <td colspan="2">FUNC.</td>
          <td>BIRTH DATE</td>
          <td>BIRTH PLACE</td>
          <td colspan="2">PASSPORT COUNTRY & NUMBER</td>
        </tr>
        ${crewRows || '<tr><td colspan="8">NONE</td></tr>'}

        <tr><th colspan="8" class="text-center" style="background:#eee;">PASSENGER MANIFEST</th></tr>
        <tr class="bold" style="font-size: 8pt;">
          <td colspan="3">NAME</td>
          <td colspan="2">BIRTH DATE</td>
          <td>BIRTH PLACE</td>
          <td colspan="2">PASSPORT COUNTRY & NUMBER</td>
        </tr>
        ${paxRows || '<tr><td colspan="8">NONE</td></tr>'}

        <tr>
          <td colspan="5">
            <strong>DECLARATION OF HEALTH</strong><br>
            PERSONS ON BOARD KNOWN TO BE SUFFERING FROM ILLNESS OTHER THAN AIRSICKNESS OR THE EFFECTS OF ACCIDENTS, AS WELL AS THOSE CASES OF ILLNESS DISEMBARKED DURING THE FLIGHT: <strong>NONE</strong><br><br>
            ANY OTHER CONDITION ON BOARD WHICH MAY LEAD TO THE SPREAD OF DISEASE: <strong>NONE</strong><br><br>
            DETAILS OF EACH DISINSECTING OR SANITARY TREATMENT (PLACE, DATE, TIME, METHOD) DURING THE FLIGHT. IF NO DISINSECTING HAS BEEN CARRIED OUT DURING THE FLIGHT GIVE DETAILS OF MOST RECENT DISINSECTING: <strong>NONE</strong><br><br>
            SIGNED, IF REQUIRED (CREW MEMBER CONCERNED): <strong>NONE</strong>
          </td>
          <td colspan="3">
            <strong>FOR OFFICIAL USE ONLY</strong>
          </td>
        </tr>
        <tr>
          <td colspan="8">
            I DECLARE THAT ALL STATEMENTS AND PARTICULARS CONTAINED IN THIS GENERAL DECLARATION, AND IN SUPPLEMENTARY FORMS REQUIRED TO BE PRESENTED WITH THIS GENERAL DECLARATION, ARE COMPLETE, EXACT AND TRUE TO THE BEST OF MY KNOWLEDGE AND THAT ALL THROUGH PASSENGERS WILL CONTINUE/HAVE CONTINUED ON THE FLIGHT.<br><br>
            <strong>NAME AND SIGNATURE (AUTHORIZED AGENT OR PILOT-IN-COMMAND):</strong><br>
            ${toUpper(document.getElementById('picName').value)}
            <br>
            ${signatureImgTag}
          </td>
        </tr>
      </table>
    `;

    document.getElementById('printable-area').style.display = 'block';
    window.print();
    document.getElementById('printable-area').style.display = 'none';
  }
</script>
</body>
</html>
