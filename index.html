<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ICAO Annex 9 - General Declaration Generator</title>
  
  <!-- Biblioteca para gerar PDF nativo direto no celular sem rodapés do sistema -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      touch-action: manipulation;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      width: 100%;
    }

    h1, h2 { color: var(--primary); text-transform: uppercase; }
    h1 { font-size: 1.1rem; text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; letter-spacing: 0.5px; }
    h2 { font-size: 0.85rem; margin-top: 20px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    @media (min-width: 600px) {
      .form-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }

    label {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input, select {
      padding: 8px 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      text-transform: uppercase;
      outline: none;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }

    input[type="date"], input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
      min-height: 38px;
    }

    input:focus, select:focus { border-color: var(--primary); }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .dynamic-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    .dynamic-table th, .dynamic-table td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: left;
    }

    .dynamic-table th {
      background-color: #0f172a;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .dynamic-table input {
      padding: 6px 8px;
      font-size: 13px;
    }

    .btn {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      transition: background-color 0.2s;
      font-size: 0.8rem;
    }

    .btn:hover { background-color: var(--primary-hover); color: white; }
    .btn-secondary { background-color: #334155; color: var(--text); margin-top: 5px; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-save { background-color: var(--success); color: #0f172a; margin-top: 15px; width: 100%; }
    .btn-save:hover { background-color: #16a34a; color: white; }
    .btn-danger { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 0.75rem; }
    .btn-clear { background-color: #475569; color: white; padding: 6px 10px; font-size: 0.7rem; margin-top: 6px; align-self: flex-start; }
    .btn-submit { width: 100%; padding: 14px; font-size: 0.95rem; margin-top: 15px; }

    .canvas-container {
      background: #ffffff;
      border: 2px dashed var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 350px;
      touch-action: none;
      margin-top: 5px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100px;
      cursor: crosshair;
    }

    .toast {
      display: none;
      background-color: var(--success);
      color: #0f172a;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    /* Container oculto onde o PDF perfeito é renderizado */
    #pdf-template {
      display: none;
    }

    /* Estilos exclusivos do PDF limpo */
    .pdf-container {
      background: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
      font-size: 8pt;
      text-transform: uppercase;
      padding: 15px;
    }

    .gen-dec-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .gen-dec-table td, .gen-dec-table th {
      border: 1px solid #000;
      padding: 4px;
      vertical-align: top;
    }

    .signature-img {
      max-height: 45px;
      max-width: 200px;
      display: block;
      margin-top: 4px;
    }

    .text-center { text-align: center; }
    .bold { font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>GENERAL DECLARATION (ICAO ANNEX 9 APPENDIX 1)</h1>
  <form id="genDecForm">
    
    <h2>1. GENERAL INFORMATION</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>OPERATOR</label>
        <input type="text" id="operator" required>
      </div>
      <div class="form-group">
        <label>REGISTRATION</label>
        <input type="text" id="registration" placeholder="PT-XXX" required>
      </div>
      <div class="form-group">
        <label>FLIGHT TYPE</label>
        <select id="flightType">
          <option value="PRIVATE">PRIVATE</option>
          <option value="SCHEDULED">SCHEDULED</option>
          <option value="CHARTER">CHARTER</option>
        </select>
      </div>
      <div class="form-group">
        <label>DATE</label>
        <input type="date" id="date" required>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>DEPARTURE FROM</label>
        <input type="text" id="depPlace" required>
      </div>
      <div class="form-group">
        <label>DEP. TIME (EXP)</label>
        <input type="time" id="depTime" required>
      </div>
      <div class="form-group">
        <label>ARRIVAL AT</label>
        <input type="text" id="arrPlace" required>
      </div>
      <div class="form-group">
        <label>ARR. TIME (EXP)</label>
        <input type="time" id="arrTime" required>
      </div>
    </div>

    <h2>2. CREW MANIFEST</h2>
    <div class="table-wrapper">
      <table class="dynamic-table" id="crewTable">
        <thead>
          <tr>
            <th>NAME</th>
            <th>FUNC.</th>
            <th>BIRTH DATE</th>
            <th>BIRTH PLACE</th>
            <th>PASSPORT & NO.</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addCrewRow()">+ ADD CREW</button>

    <h2>3. PASSENGER MANIFEST</h2>
    <div class="table-wrapper">
      <table class="dynamic-table" id="paxTable">
        <thead>
          <tr>
            <th>NAME</th>
            <th>BIRTH DATE</th>
            <th>BIRTH PLACE</th>
            <th>PASSPORT & NO.</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addPaxRow()">+ ADD PASSENGER</button>

    <h2>4. HEALTH & AUTHORIZATION</h2>
    <div class="form-group">
      <label>AUTHORIZED AGENT OR PILOT-IN-COMMAND</label>
      <input type="text" id="picName" required>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label>SIGNATURE (DESENHE ABAIXO)</label>
      <div class="canvas-container">
        <canvas id="sigCanvas" width="350" height="100"></canvas>
      </div>
      <button type="button" class="btn btn-clear" onclick="clearCanvas()">LIMPAR ASSINATURA</button>
    </div>

    <button type="button" class="btn btn-save" onclick="saveDefaults()">💾 SALVAR OPERADOR, CREW E ASSINATURA</button>
    <div id="toast" class="toast">DADOS SALVOS COM SUCESSO!</div>

    <button type="button" class="btn btn-submit" id="btnGenerate" onclick="generatePDF()">📥 GERAR E BAIXAR PDF</button>
  </form>
</div>

<!-- Template invisível para compilação do PDF -->
<div id="pdf-template"></div>

<script>
  let canvas, ctx, isDrawing = false;

  window.onload = () => {
    initCanvas();
    loadDefaults();
  };

  function initCanvas() {
    canvas = document.getElementById('sigCanvas');
    ctx = canvas.getContext('2d');
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000000';

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      canvas.dispatchEvent(new MouseEvent('mousedown', {
        clientX: touch.clientX, clientY: touch.clientY
      }));
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      canvas.dispatchEvent(new MouseEvent('mousemove', {
        clientX: touch.clientX, clientY: touch.clientY
      }));
    });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      canvas.dispatchEvent(new MouseEvent('mouseup', {}));
    });
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    if (isDrawing) {
      ctx.closePath();
      isDrawing = false;
    }
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function isCanvasBlank() {
    const pixelBuffer = new Uint32Array(
      ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer
    );
    return !pixelBuffer.some(color => color !== 0);
  }

  function toUpper(str) {
    return (str || '').toUpperCase();
  }

  function addCrewRow(name = '', func = 'PILOT', dob = '', pob = '', pass = '') {
    const tbody = document.querySelector('#crewTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="c-name" value="${name}"></td>
      <td><input type="text" class="c-func" value="${func}"></td>
      <td><input type="date" class="c-dob" value="${dob}"></td>
      <td><input type="text" class="c-pob" value="${pob}"></td>
      <td><input type="text" class="c-pass" value="${pass}"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function addPaxRow() {
    const tbody = document.querySelector('#paxTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="p-name"></td>
      <td><input type="date" class="p-dob"></td>
      <td><input type="text" class="p-pob"></td>
      <td><input type="text" class="p-pass"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function saveDefaults() {
    const operator = document.getElementById('operator').value;
    const picName = document.getElementById('picName').value;
    
    const crewData = [];
    document.querySelectorAll('#crewTable tbody tr').forEach(tr => {
      crewData.push({
        name: tr.querySelector('.c-name').value,
        func: tr.querySelector('.c-func').value,
        dob: tr.querySelector('.c-dob').value,
        pob: tr.querySelector('.c-pob').value,
        pass: tr.querySelector('.c-pass').value
      });
    });

    const sigData = isCanvasBlank() ? '' : canvas.toDataURL();

    const defaults = { operator, picName, crewData, sigData };
    localStorage.setItem('gendec_defaults', JSON.stringify(defaults));

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }

  function loadDefaults() {
    const saved = localStorage.getItem('gendec_defaults');
    
    if (saved) {
      const defaults = JSON.parse(saved);
      document.getElementById('operator').value = defaults.operator || '';
      document.getElementById('picName').value = defaults.picName || '';
      
      const tbody = document.querySelector('#crewTable tbody');
      tbody.innerHTML = '';
      if (defaults.crewData && defaults.crewData.length > 0) {
        defaults.crewData.forEach(c => addCrewRow(c.name, c.func, c.dob, c.pob, c.pass));
      } else {
        addCrewRow('', 'PILOT');
        addCrewRow('', 'PILOT');
      }

      if (defaults.sigData) {
        const img = new Image();
        img.onload = () => {
          clearCanvas();
          ctx.drawImage(img, 0, 0);
        };
        img.src = defaults.sigData;
      }
    } else {
      addCrewRow('', 'PILOT');
      addCrewRow('', 'PILOT');
    }

    addPaxRow();
  }

  function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function generatePDF() {
    const btn = document.getElementById('btnGenerate');
    btn.innerText = "GERANDO PDF...";
    btn.disabled = true;

    let crewRows = '';
    document.querySelectorAll('#crewTable tbody tr').forEach(tr => {
      const name = toUpper(tr.querySelector('.c-name').value);
      const func = toUpper(tr.querySelector('.c-func').value);
      const dob = formatDate(tr.querySelector('.c-dob').value);
      const pob = toUpper(tr.querySelector('.c-pob').value);
      const pass = toUpper(tr.querySelector('.c-pass').value);
      if (name) {
        crewRows += `
          <tr>
            <td colspan="2">${name}</td>
            <td colspan="2">${func}</td>
            <td>${dob}</td>
            <td>${pob}</td>
            <td colspan="2">${pass}</td>
          </tr>`;
      }
    });

    let paxRows = '';
    document.querySelectorAll('#paxTable tbody tr').forEach(tr => {
      const name = toUpper(tr.querySelector('.p-name').value);
      const dob = formatDate(tr.querySelector('.p-dob').value);
      const pob = toUpper(tr.querySelector('.p-pob').value);
      const pass = toUpper(tr.querySelector('.p-pass').value);
      if (name) {
        paxRows += `
          <tr>
            <td colspan="3">${name}</td>
            <td colspan="2">${dob}</td>
            <td>${pob}</td>
            <td colspan="2">${pass}</td>
          </tr>`;
      }
    });

    const signatureImgTag = isCanvasBlank() 
      ? '<br><br>________________________________________________________'
      : `<img src="${canvas.toDataURL()}" class="signature-img" /><br>________________________________________________________`;

    const element = document.getElementById('pdf-template');
    element.style.display = 'block';
    element.innerHTML = `
      <div class="pdf-container">
        <div class="text-center bold" style="font-size: 11pt;">GENERAL DECLARATION</div>
        <div class="text-center" style="font-size: 8pt; margin-bottom: 8px;">(OUTWARD/INWARD)<br>ICAO ANNEX 9 APPENDIX 1<br>AGRICULTURE, CUSTOMS, IMMIGRATION, AND PUBLIC HEALTH</div>
        
        <table class="gen-dec-table">
          <tr>
            <td colspan="4"><strong>OPERATOR:</strong> ${toUpper(document.getElementById('operator').value)}</td>
            <td colspan="4"><strong>DATE:</strong> ${formatDate(document.getElementById('date').value)}</td>
          </tr>
          <tr>
            <td colspan="4"><strong>MARKS OF NATIONALITY AND REGISTRATION:</strong> ${toUpper(document.getElementById('registration').value)}</td>
            <td colspan="4"><strong>FLIGHT:</strong> ${toUpper(document.getElementById('flightType').value)}</td>
          </tr>
          <tr>
            <td colspan="4"><strong>DEPARTURE FROM (PLACE):</strong> ${toUpper(document.getElementById('depPlace').value)}</td>
            <td colspan="4"><strong>ARRIVAL AT (PLACE):</strong> ${toUpper(document.getElementById('arrPlace').value)}</td>
          </tr>
          <tr>
            <td colspan="4"><strong>DEPARTURE TIME (EXPECTED):</strong> ${document.getElementById('depTime').value}</td>
            <td colspan="4"><strong>ARRIVAL TIME (EXPECTED):</strong> ${document.getElementById('arrTime').value}</td>
          </tr>
          
          <tr><th colspan="8" class="text-center" style="background:#eee;">CREW MANIFEST</th></tr>
          <tr class="bold" style="font-size: 8pt;">
            <td colspan="2">NAME</td>
            <td colspan="2">FUNC.</td>
            <td>BIRTH DATE</td>
            <td>BIRTH PLACE</td>
            <td colspan="2">PASSPORT COUNTRY & NUMBER</td>
          </tr>
          ${crewRows || '<tr><td colspan="8">NONE</td></tr>'}

          <tr><th colspan="8" class="text-center" style="background:#eee;">PASSENGER MANIFEST</th></tr>
          <tr class="bold" style="font-size: 8pt;">
            <td colspan="3">NAME</td>
            <td colspan="2">BIRTH DATE</td>
            <td>BIRTH PLACE</td>
            <td colspan="2">PASSPORT COUNTRY & NUMBER</td>
          </tr>
          ${paxRows || '<tr><td colspan="8">NONE</td></tr>'}

          <tr>
            <td colspan="5">
              <strong>DECLARATION OF HEALTH</strong><br>
              PERSONS ON BOARD KNOWN TO BE SUFFERING FROM ILLNESS OTHER THAN AIRSICKNESS OR THE EFFECTS OF ACCIDENTS, AS WELL AS THOSE CASES OF ILLNESS DISEMBARKED DURING THE FLIGHT: <strong>NONE</strong><br><br>
              ANY OTHER CONDITION ON BOARD WHICH MAY LEAD TO THE SPREAD OF DISEASE: <strong>NONE</strong><br><br>
              DETAILS OF EACH DISINSECTING OR SANITARY TREATMENT (PLACE, DATE, TIME, METHOD) DURING THE FLIGHT. IF NO DISINSECTING HAS BEEN CARRIED OUT DURING THE FLIGHT GIVE DETAILS OF MOST RECENT DISINSECTING: <strong>NONE</strong><br><br>
              SIGNED, IF REQUIRED (CREW MEMBER CONCERNED): <strong>NONE</strong>
            </td>
            <td colspan="3">
              <strong>FOR OFFICIAL USE ONLY</strong>
            </td>
          </tr>
          <tr>
            <td colspan="8">
              I DECLARE THAT ALL STATEMENTS AND PARTICULARS CONTAINED IN THIS GENERAL DECLARATION, AND IN SUPPLEMENTARY FORMS REQUIRED TO BE PRESENTED WITH THIS GENERAL DECLARATION, ARE COMPLETE, EXACT AND TRUE TO THE BEST OF MY KNOWLEDGE AND THAT ALL THROUGH PASSENGERS WILL CONTINUE/HAVE CONTINUED ON THE FLIGHT.<br><br>
              <strong>NAME AND SIGNATURE (AUTHORIZED AGENT OR PILOT-IN-COMMAND):</strong><br>
              ${toUpper(document.getElementById('picName').value)}
              <br>
              ${signatureImgTag}
            </td>
          </tr>
        </table>
      </div>
    `;

    const opt = {
      margin:       5,
      filename:     `GENDEC_${toUpper(document.getElementById('registration').value) || 'FLIGHT'}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
      element.style.display = 'none';
      btn.innerText = "📥 GERAR E BAIXAR PDF";
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
