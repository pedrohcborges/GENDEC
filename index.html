<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GENDEC - General Declaration Generator</title>

  <!-- SUPORTE PWA / IOS (TELA DE INÍCIO) COM SEU ÍCONE PERSONALIZADO -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GENDEC">
  <link rel="apple-touch-icon" href="gendec_icon_512.png">
  <link rel="icon" type="image/png" href="gendec_icon_512.png">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #34d399;
      --danger: #f87171;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
      touch-action: manipulation;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary);
    }

    .brand-logo svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    .brand-logo .title-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand-logo h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--primary);
      margin: 0;
      padding: 0;
      border: none;
      line-height: 1;
    }

    .brand-logo .sub-title {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    h2 { font-size: 0.85rem; margin-top: 20px; border-bottom: 1px solid var(--border); padding-bottom: 6px; color: var(--primary); text-transform: uppercase; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    @media (min-width: 600px) {
      .form-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }

    label {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input, select {
      padding: 8px 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      text-transform: uppercase;
      outline: none;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }

    input.field-error {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px var(--danger);
    }

    input[type="date"], input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
      min-height: 38px;
      color-scheme: dark;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .dynamic-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    .dynamic-table th, .dynamic-table td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: left;
    }

    .dynamic-table th {
      background-color: #0f172a;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .dynamic-table input {
      padding: 6px 8px;
      font-size: 13px;
    }

    .btn {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      transition: background-color 0.2s;
      font-size: 0.8rem;
    }

    .btn:hover { background-color: var(--primary-hover); color: white; }
    .btn-secondary { background-color: transparent; color: var(--text-muted); border: 1.5px solid var(--border); margin-top: 5px; }
    .btn-secondary:hover { color: var(--text); border-color: var(--primary); }
    .btn-save { background-color: var(--success); color: #0f172a; margin-top: 15px; width: 100%; }
    .btn-save:hover { background-color: #16a34a; color: white; }
    .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }
    .btn-danger:hover { background-color: var(--danger); color: white; }
    .btn-clear { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 6px 10px; font-size: 0.7rem; margin-top: 6px; align-self: flex-start; border-radius: 4px; }
    .btn-clear:hover { color: var(--text); border-color: var(--primary); }
    .btn-submit { width: 100%; padding: 14px; font-size: 0.95rem; margin-top: 15px; }
    .btn-reset { width: 100%; padding: 10px; font-size: 0.8rem; margin-top: 8px; background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-reset:hover { color: var(--text); border-color: var(--primary); }

    .canvas-container {
      background: #ffffff;
      border: 1.5px dashed var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 350px;
      touch-action: none;
      margin-top: 5px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100px;
      cursor: crosshair;
    }

    .toast {
      display: none;
      background-color: var(--success);
      color: #0f172a;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .toast.error {
      background-color: var(--danger);
      color: white;
    }

    #printable-area {
      display: none;
    }

    /* Impressão Equilibrada (A4 1 Folha com tamanho constante e legível) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 5mm 6mm;
      }

      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
      }

      .no-print, .container {
        display: none !important;
      }

      #printable-area {
        display: block !important;
        visibility: visible !important;
        width: 100% !important;
        background: white !important;
        color: black !important;
        font-family: Arial, sans-serif !important;
        font-size: 8.5pt !important;
        line-height: 1.25 !important;
        text-transform: uppercase !important;
      }

      .gen-dec-table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 6px !important;
        table-layout: fixed !important;
      }

      .gen-dec-table td, .gen-dec-table th {
        border: 1px solid #000 !important;
        padding: 4px 6px !important;
        vertical-align: middle !important;
        page-break-inside: avoid !important;
        word-wrap: break-word !important;
        overflow-wrap: break-word !important;
      }

      .gen-dec-table tr {
        page-break-inside: avoid !important;
      }

      .signature-img {
        max-height: 35px !important;
        max-width: 180px !important;
        display: block !important;
        margin-top: 3px !important;
      }

      .gd-title { font-size: 12pt !important; margin-bottom: 2px !important; }
      .gd-subtitle { font-size: 7.5pt !important; margin-bottom: 6px !important; }
      .gd-section-header { font-size: 8pt !important; }

      .text-center { text-align: center !important; }
      .bold { font-weight: bold !important; }
    }
  </style>
</head>
<body>

<div class="container no-print">
  
  <div class="brand-logo">
    <svg viewBox="0 0 24 24">
      <path d="M21,16V14L13,9V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V9L2,14V16L10,13.5V19L8,20.5V22L11.5,21L15,22V20.5L13,19V13.5L21,16Z"/>
    </svg>
    <div class="title-container">
      <h1>GENDEC</h1>
      <span class="sub-title">ICAO Annex 9 General Declaration Generator</span>
    </div>
  </div>

  <form id="genDecForm">
    
    <h2>1. GENERAL INFORMATION</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>OPERATOR</label>
        <input type="text" id="operator" required>
      </div>
      <div class="form-group">
        <label>REGISTRATION</label>
        <input type="text" id="registration" placeholder="PT-XXX" required>
      </div>
      <div class="form-group">
        <label>FLIGHT TYPE</label>
        <select id="flightType">
          <option value="PRIVATE">PRIVATE</option>
          <option value="SCHEDULED">SCHEDULED</option>
          <option value="CHARTER">CHARTER</option>
        </select>
      </div>
      <div class="form-group">
        <label>DATE</label>
        <input type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="date-mask" id="date" required>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>DEPARTURE FROM</label>
        <input type="text" id="depPlace" required>
      </div>
      <div class="form-group">
        <label>DEP. TIME (EXP)</label>
        <input type="time" id="depTime" required>
      </div>
      <div class="form-group">
        <label>ARRIVAL AT</label>
        <input type="text" id="arrPlace" required>
      </div>
      <div class="form-group">
        <label>ARR. TIME (EXP)</label>
        <input type="time" id="arrTime" required>
      </div>
    </div>

    <h2>2. CREW MANIFEST</h2>
    <div class="table-wrapper">
      <table class="dynamic-table" id="crewTable">
        <thead>
          <tr>
            <th>NAME</th>
            <th>FUNC.</th>
            <th>BIRTH DATE</th>
            <th>BIRTH PLACE</th>
            <th>PASSPORT & NO.</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addCrewRow()">+ ADD CREW</button>

    <h2>3. PASSENGER MANIFEST</h2>
    <div class="table-wrapper">
      <table class="dynamic-table" id="paxTable">
        <thead>
          <tr>
            <th>NAME</th>
            <th>BIRTH DATE</th>
            <th>BIRTH PLACE</th>
            <th>PASSPORT & NO.</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button type="button" class="btn btn-secondary" onclick="addPaxRow()">+ ADD PASSENGER</button>

    <h2>4. HEALTH & AUTHORIZATION</h2>
    <div class="form-group">
      <label>AUTHORIZED AGENT OR PILOT-IN-COMMAND</label>
      <input type="text" id="picName" required>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label>SIGNATURE (DESENHE ABAIXO)</label>
      <div class="canvas-container">
        <canvas id="sigCanvas" width="350" height="100"></canvas>
      </div>
      <button type="button" class="btn btn-clear" onclick="clearCanvas()">LIMPAR ASSINATURA</button>
    </div>

    <button type="button" class="btn btn-save" onclick="saveDefaults()">💾 SALVAR OPERADOR, CREW E ASSINATURA</button>
    <div id="toast" class="toast"></div>

    <button type="button" class="btn btn-submit" onclick="generateAndPrint()">GERAR / IMPRIMIR DECLARAÇÃO</button>
    <button type="button" class="btn btn-reset" onclick="resetFlight()">🔄 NOVO VOO (limpa data/rota/passageiros)</button>
  </form>
</div>

<!-- Área Gerada Exclusiva para Impressão -->
<div id="printable-area"></div>

<script>
  let canvas, ctx, isDrawing = false;

  window.onload = () => {
    initCanvas();
    loadDefaults();
  };

  function initCanvas() {
    canvas = document.getElementById('sigCanvas');
    ctx = canvas.getContext('2d');
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000000';

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const mouseEvent = new MouseEvent('mousedown', {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const mouseEvent = new MouseEvent('mousemove', {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      canvas.dispatchEvent(new MouseEvent('mouseup', {}));
    });
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    if (isDrawing) {
      ctx.closePath();
      isDrawing = false;
    }
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function isCanvasBlank() {
    const pixelBuffer = new Uint32Array(
      ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer
    );
    return !pixelBuffer.some(color => color !== 0);
  }

  function toUpper(str) {
    return (str || '').toUpperCase();
  }

  function escapeHtml(str) {
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function addCrewRow(name = '', func = 'PILOT', dob = '', pob = '', pass = '') {
    const tbody = document.querySelector('#crewTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="c-name" value="${escapeHtml(name)}"></td>
      <td><input type="text" class="c-func" value="${escapeHtml(func)}"></td>
      <td><input type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="c-dob date-mask" value="${escapeHtml(dob)}"></td>
      <td><input type="text" class="c-pob" value="${escapeHtml(pob)}"></td>
      <td><input type="text" class="c-pass" value="${escapeHtml(pass)}"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function addPaxRow() {
    const tbody = document.querySelector('#paxTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="p-name"></td>
      <td><input type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" class="p-dob date-mask"></td>
      <td><input type="text" class="p-pob"></td>
      <td><input type="text" class="p-pass"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(row);
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.toggle('error', isError);
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }

  function saveDefaults() {
    const operator = document.getElementById('operator').value;
    const picName = document.getElementById('picName').value;
    
    const crewData = [];
    document.querySelectorAll('#crewTable tbody tr').forEach(tr => {
      crewData.push({
        name: tr.querySelector('.c-name').value,
        func: tr.querySelector('.c-func').value,
        dob: tr.querySelector('.c-dob').value,
        pob: tr.querySelector('.c-pob').value,
        pass: tr.querySelector('.c-pass').value
      });
    });

    const sigData = isCanvasBlank() ? '' : canvas.toDataURL();

    const defaults = { operator, picName, crewData, sigData };
    localStorage.setItem('gendec_defaults', JSON.stringify(defaults));

    showToast('DADOS SALVOS COM SUCESSO!');
  }

  function loadDefaults() {
    const saved = localStorage.getItem('gendec_defaults');
    
    if (saved) {
      const defaults = JSON.parse(saved);
      document.getElementById('operator').value = defaults.operator || '';
      document.getElementById('picName').value = defaults.picName || '';
      
      const tbody = document.querySelector('#crewTable tbody');
      tbody.innerHTML = '';
      if (defaults.crewData) {
        defaults.crewData.forEach(c => addCrewRow(c.name, c.func, formatDate(c.dob), c.pob, c.pass));
      } else {
        addCrewRow('', 'PILOT');
        addCrewRow('', 'PILOT');
      }

      if (defaults.sigData) {
        const img = new Image();
        img.onload = () => {
          clearCanvas();
          ctx.drawImage(img, 0, 0);
        };
        img.src = defaults.sigData;
      }
    } else {
      addCrewRow('', 'PILOT');
      addCrewRow('', 'PILOT');
    }

    addPaxRow();
  }

  function resetFlight() {
    if (!confirm('Limpar data, rota e lista de passageiros deste voo? (Operador, tripulação e assinatura salvos são mantidos)')) {
      return;
    }
    document.getElementById('date').value = '';
    document.getElementById('depPlace').value = '';
    document.getElementById('depTime').value = '';
    document.getElementById('arrPlace').value = '';
    document.getElementById('arrTime').value = '';
    document.getElementById('registration').value = '';
    document.getElementById('flightType').value = 'PRIVATE';

    const paxTbody = document.querySelector('#paxTable tbody');
    paxTbody.innerHTML = '';
    addPaxRow();

    clearFieldErrors();
    showToast('NOVO VOO — CAMPOS LIMPOS');
  }

  function formatDate(d) {
    if (!d) return '';
    const isoMatch = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoMatch) {
      return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
    }
    return d;
  }

  function formatDateInput(el) {
    const digits = el.value.replace(/\D/g, '').slice(0, 8);
    let formatted = digits;
    if (digits.length > 4) {
      formatted = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
    } else if (digits.length > 2) {
      formatted = digits.slice(0, 2) + '/' + digits.slice(2);
    }
    el.value = formatted;
  }

  document.addEventListener('input', function(e) {
    if (e.target.classList && e.target.classList.contains('date-mask')) {
      formatDateInput(e.target);
    }
  });

  function clearFieldErrors() {
    document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));
  }

  function validateForm() {
    clearFieldErrors();
    const requiredIds = ['operator', 'registration', 'date', 'depPlace', 'depTime', 'arrPlace', 'arrTime', 'picName'];

    requiredIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el.value || !el.value.trim()) {
        el.classList.add('field-error');
      }
    });
  }

  function generateAndPrint() {
    validateForm();

    const container = document.getElementById('printable-area');
    
    let crewRows = '';
    document.querySelectorAll('#crewTable tbody tr').forEach(tr => {
      const name = toUpper(escapeHtml(tr.querySelector('.c-name').value));
      const func = toUpper(escapeHtml(tr.querySelector('.c-func').value));
      const dob = formatDate(tr.querySelector('.c-dob').value);
      const pob = toUpper(escapeHtml(tr.querySelector('.c-pob').value));
      const pass = toUpper(escapeHtml(tr.querySelector('.c-pass').value));
      if (name) {
        crewRows += `
          <tr>
            <td colspan="2">${name}</td>
            <td>${func}</td>
            <td>${dob}</td>
            <td colspan="2">${pob}</td>
            <td colspan="2">${pass}</td>
          </tr>`;
      }
    });

    let paxRows = '';
    document.querySelectorAll('#paxTable tbody tr').forEach(tr => {
      const name = toUpper(escapeHtml(tr.querySelector('.p-name').value));
      const dob = formatDate(tr.querySelector('.p-dob').value);
      const pob = toUpper(escapeHtml(tr.querySelector('.p-pob').value));
      const pass = toUpper(escapeHtml(tr.querySelector('.p-pass').value));
      if (name) {
        paxRows += `
          <tr>
            <td colspan="3">${name}</td>
            <td>${dob}</td>
            <td colspan="2">${pob}</td>
            <td colspan="2">${pass}</td>
          </tr>`;
      }
    });

    const signatureImgTag = isCanvasBlank() 
      ? '<br>________________________________________________________'
      : `<img src="${canvas.toDataURL()}" class="signature-img" /><br>________________________________________________________`;

    container.innerHTML = `
      <div class="text-center bold gd-title">GENERAL DECLARATION</div>
      <div class="text-center gd-subtitle">(OUTWARD/INWARD)<br>ICAO ANNEX 9 APPENDIX 1<br>AGRICULTURE, CUSTOMS, IMMIGRATION, AND PUBLIC HEALTH</div>
      
      <table class="gen-dec-table">
        <colgroup>
          <col style="width: 15%">
          <col style="width: 15%">
          <col style="width: 8%">
          <col style="width: 8%">
          <col style="width: 13.5%">
          <col style="width: 13.5%">
          <col style="width: 13.5%">
          <col style="width: 13.5%">
        </colgroup>
        <tr>
          <td colspan="4"><strong>OPERATOR:</strong> ${toUpper(escapeHtml(document.getElementById('operator').value))}</td>
          <td colspan="4"><strong>DATE:</strong> ${formatDate(document.getElementById('date').value)}</td>
        </tr>
        <tr>
          <td colspan="4"><strong>MARKS OF NATIONALITY AND REGISTRATION:</strong> ${toUpper(escapeHtml(document.getElementById('registration').value))}</td>
          <td colspan="4"><strong>FLIGHT:</strong> ${toUpper(document.getElementById('flightType').value)}</td>
        </tr>
        <tr>
          <td colspan="4"><strong>DEPARTURE FROM (PLACE):</strong> ${toUpper(escapeHtml(document.getElementById('depPlace').value))}</td>
          <td colspan="4"><strong>ARRIVAL AT (PLACE):</strong> ${toUpper(escapeHtml(document.getElementById('arrPlace').value))}</td>
        </tr>
        <tr>
          <td colspan="4"><strong>DEPARTURE TIME (EXPECTED):</strong> ${document.getElementById('depTime').value}</td>
          <td colspan="4"><strong>ARRIVAL TIME (EXPECTED):</strong> ${document.getElementById('arrTime').value}</td>
        </tr>
        
        <tr><th colspan="8" class="text-center gd-section-header" style="background:#eee;">CREW MANIFEST</th></tr>
        <tr class="bold" style="font-size: 7.5pt;">
          <td colspan="2">NAME</td>
          <td>FUNC.</td>
          <td>BIRTH DATE</td>
          <td colspan="2">BIRTH PLACE</td>
          <td colspan="2">PASSPORT COUNTRY & NUMBER</td>
        </tr>
        ${crewRows || '<tr><td colspan="8">NONE</td></tr>'}

        <tr><th colspan="8" class="text-center gd-section-header" style="background:#eee;">PASSENGER MANIFEST</th></tr>
        <tr class="bold" style="font-size: 7.5pt;">
          <td colspan="3">NAME</td>
          <td>BIRTH DATE</td>
          <td colspan="2">BIRTH PLACE</td>
          <td colspan="2">PASSPORT COUNTRY & NUMBER</td>
        </tr>
        ${paxRows || '<tr><td colspan="8">NONE</td></tr>'}

        <tr>
          <td colspan="5">
            <strong>DECLARATION OF HEALTH</strong><br>
            PERSONS ON BOARD KNOWN TO BE SUFFERING FROM ILLNESS OTHER THAN AIRSICKNESS OR THE EFFECTS OF ACCIDENTS, AS WELL AS THOSE CASES OF ILLNESS DISEMBARKED DURING THE FLIGHT: <strong>NONE</strong><br>
            ANY OTHER CONDITION ON BOARD WHICH MAY LEAD TO THE SPREAD OF DISEASE: <strong>NONE</strong><br>
            DETAILS OF EACH DISINSECTING OR SANITARY TREATMENT (PLACE, DATE, TIME, METHOD) DURING THE FLIGHT. IF NO DISINSECTING HAS BEEN CARRIED OUT DURING THE FLIGHT GIVE DETAILS OF MOST RECENT DISINSECTING: <strong>NONE</strong><br>
            SIGNED, IF REQUIRED (CREW MEMBER CONCERNED): <strong>NONE</strong>
          </td>
          <td colspan="3">
            <strong>FOR OFFICIAL USE ONLY</strong>
          </td>
        </tr>
        <tr>
          <td colspan="8">
            I DECLARE THAT ALL STATEMENTS AND PARTICULARS CONTAINED IN THIS GENERAL DECLARATION, AND IN SUPPLEMENTARY FORMS REQUIRED TO BE PRESENTED WITH THIS GENERAL DECLARATION, ARE COMPLETE, EXACT AND TRUE TO THE BEST OF MY KNOWLEDGE AND THAT ALL THROUGH PASSENGERS WILL CONTINUE/HAVE CONTINUED ON THE FLIGHT.<br>
            <strong>NAME AND SIGNATURE (AUTHORIZED AGENT OR PILOT-IN-COMMAND):</strong><br>
            ${toUpper(escapeHtml(document.getElementById('picName').value))}
            ${signatureImgTag}
          </td>
        </tr>
      </table>
    `;

    setTimeout(() => {
      try {
        window.print();
      } catch (err) {
        alert('Não foi possível abrir a impressão. Abra este arquivo diretamente no Safari/Chrome (fora do visualizador do app) e tente novamente.');
      }
    }, 150);
  }
</script>
